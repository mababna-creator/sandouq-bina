
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#145c45">
  <title>صندوق البناية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #103d32, #21785a);
      color: white;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 35px 22px;
    }

    .icon {
      font-size: 75px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 12px;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
      color: #e0eee7;
      margin-bottom: 35px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #145c45;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      margin-top: 35px;
      font-size: 13px;
      color: #d5e7de;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">🏢</div>

    <h1>صندوق البناية</h1>

    <p>
      نظام إدارة الاشتراكات والمصروفات
      والحركات المالية لصندوق البناية
    </p>

    <button onclick="openLogin()">
      بدء الاستخدام
    </button>

    <footer>
      نظام إدارة صندوق البناية
    </footer>
  </main>

  <script>
    function openLogin() {
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
